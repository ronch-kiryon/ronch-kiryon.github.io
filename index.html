<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>סידור עבודה רונצ׳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<meta name="theme-color" content="#3d1c0e">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: warm, practical shop tool — used standing at the counter on a phone.
   IDEA: the shift board pinned by the bakery ovens: one card per day, morning above evening.
   PICTURE: the week's day cards themselves, large hanging times, names beside them.
   COLOUR and TYPE: Rönch brown band, white ground, logo yellow for morning, dusk blue for evening; Rubik + Assistant.
   LAYOUT: one column on phones, cards in a wrapping grid on wider screens; actions stick to the bottom. */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#18110c);--card:light-dark(#fbf7f1,#231912);--ink:light-dark(#2b1d14,#f3e9dd);--mute:light-dark(#75604f,#b8a593);--line:light-dark(#eadfd1,#3a2b20);--crust:light-dark(#3d1c0e,#2a140a);--wheat:#f8d650;--wheatS:light-dark(#fcf1c4,#463a13);--dusk:light-dark(#35517a,#a9c3ea);--duskS:light-dark(#e2eaf5,#1f2e45);--bad:light-dark(#b3412e,#ff8e7a);--badS:light-dark(#fdeae6,#3d1d17);--good:light-dark(#2f7d4f,#7fd3a1);--goodS:light-dark(#e3f4ea,#173226)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Assistant,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Rubik,Assistant,sans-serif;line-height:1.1;margin:0;text-wrap:balance}
h2{font-size:24px;margin-bottom:12px}h3{font-size:19px;margin:18px 0 8px}
.logo{background:#fff;display:flex;justify-content:center;padding:6px 16px;border-bottom:4px solid var(--wheat)}.logo img{height:clamp(64px,13vw,104px);width:auto;display:block}
.top{background:var(--crust);color:#f7ead8;padding:16px max(5vw,16px) 14px}
.top .row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.top h1{font-size:clamp(22px,4.5vw,30px)}
.top small{color:#d9c2a6;font-size:15px}
.wk{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.wk b{font:500 19px Rubik,sans-serif;white-space:nowrap;padding:0 6px}
.wk .lk{font-size:14px;padding:3px 10px;border-radius:999px;background:#ffffff22;white-space:nowrap}
.top button{background:#ffffff1a;color:#fff;border-color:#ffffff33}
.top button.on{background:var(--wheat);color:#2b1d14;border-color:var(--wheat)}
.band{padding:clamp(18px,3vw,36px) max(5vw,16px);max-width:1240px;margin:0 auto}
.narrow{max-width:520px}
button,select,input,textarea{font:inherit;font-size:16px;color:inherit}
button{min-height:44px;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--wheat);outline-offset:2px}
.pri{background:var(--crust);color:#fff;border-color:var(--crust);font-weight:700;padding-inline:22px}
:root[data-theme=dark] .pri{background:var(--wheat);color:#2b1d14;border-color:var(--wheat)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .pri{background:var(--wheat);color:#2b1d14;border-color:var(--wheat)}}
.ghost{background:none;border-color:transparent;color:var(--mute);text-decoration:underline}
.danger{color:var(--bad)}
.wa{display:inline-flex;align-items:center;min-height:44px;padding:8px 14px;border-radius:12px;background:#1f8f4e;color:#fff;font-weight:700;text-decoration:none}
label{display:block;margin:0 0 14px;font-weight:600}
input,select,textarea{display:block;width:100%;margin-top:6px;min-height:46px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
textarea{min-height:76px}
.mute{color:var(--mute)}.err{color:var(--bad);font-weight:600}.ok{color:var(--good);font-weight:600}
.tabs{display:flex;gap:6px;margin-bottom:18px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.tabs::-webkit-scrollbar{display:none}.tabs button{white-space:nowrap;flex:none}
.flag{color:var(--bad);font-weight:700;font-size:13px}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs .dot{display:inline-block;min-width:22px;padding:0 6px;margin-inline-start:6px;border-radius:999px;background:var(--bad);color:#fff;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:14px}
.day,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.card{display:grid;gap:10px;align-content:start}
.dh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;gap:8px}
.dh b{font:700 20px Rubik,sans-serif}.dh span{color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border-radius:999px;font-size:15px;padding:8px 12px;white-space:nowrap}
.chip.on{font-weight:700}
.chip.on.m{background:var(--wheat);border-color:var(--wheat);color:#2b1d14}
.chip.on.e{background:var(--dusk);border-color:var(--dusk);color:var(--bg)}
.chip.on.n{background:var(--line)}
.chip.on.x{background:var(--crust);border-color:var(--crust);color:#fff}
.chip.on.a{background:#d9822b;border-color:#d9822b;color:#fff}
.sec.a,.tag.a{background:#f6dcc0;color:#6b3a0c}
.sec.x,.tag.x{background:var(--crust);color:#fff}
.sec{font-size:13px;font-weight:700;margin:10px 0 4px;padding:2px 10px;border-radius:999px;display:inline-block}
.sec.m{background:var(--wheatS)}.sec.e{background:var(--duskS)}
.slot{display:grid;grid-template-columns:96px minmax(0,1fr) auto;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.slot:last-child{border-bottom:0}
.slot .t{font:500 15px Rubik,sans-serif;white-space:nowrap;direction:ltr;text-align:right}
.slot .nm{font-weight:700}
.slot.me .nm{background:var(--wheat);color:#2b1d14;border-radius:8px;padding:0 8px;justify-self:start}
.slot select{margin:0;min-height:40px;padding:6px 8px;font-size:15px}
.miss{color:var(--bad);font-weight:700;font-size:14px}
.x{min-height:36px;padding:2px 10px;font-size:14px}
.hd{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.hd b{font:700 19px Rubik,sans-serif}
.tag{font-size:14px;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--line)}
.tag.m{background:var(--wheatS)}.tag.e{background:var(--duskS)}
.st{font-size:14px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.st.pending{background:var(--wheatS)}.st.approved{background:var(--goodS);color:var(--good)}.st.rejected{background:var(--badS);color:var(--bad)}.st.cancelled{background:var(--line)}
.steps{display:flex;gap:14px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:6px;font-weight:600}
.step button{width:44px;padding:0;font-size:20px}
.step output{min-width:28px;text-align:center;font:700 20px Rubik,sans-serif}
.bar{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px max(5vw,16px);display:flex;gap:10px;flex-wrap:wrap;align-items:center;z-index:2}
.bar.fix{position:fixed;left:0;right:0;bottom:0;padding-bottom:calc(12px + env(safe-area-inset-bottom));transform:translateZ(0);box-shadow:0 -6px 16px rgba(0,0,0,.25)}
.barpad{height:150px}
.note{background:var(--wheatS);border-radius:12px;padding:10px 14px;margin-bottom:14px}
.warn{background:var(--badS);border-radius:12px;padding:10px 14px;margin-bottom:14px}
.good{background:var(--goodS);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.warn ul{margin:4px 0 0;padding-inline-start:20px}
.list{display:grid}
.list .it{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.sum{display:flex;flex-wrap:wrap;gap:6px 14px;margin:6px 0 16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:10px;margin-bottom:22px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;text-align:start}
.tile b{display:block;font:700 clamp(30px,6vw,40px)/1 Rubik,sans-serif;margin-bottom:6px}
.tile.hot{background:var(--wheatS);border-color:var(--wheat)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:8px 0 14px}
.cal .dn{text-align:center;font-size:13px;color:var(--mute);font-weight:700}
.cal button{min-height:44px;padding:0;border-radius:10px;font-weight:600}
.cal button.sel{background:var(--crust);color:#fff;border-color:var(--crust)}
.cal button.had{box-shadow:inset 0 -4px 0 var(--wheat)}
.calh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.diff{font-size:15px}.diff del{color:var(--bad)}.diff ins{color:var(--good);text-decoration:none;font-weight:700}
details summary{cursor:pointer;font-weight:600;min-height:32px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
th{font-weight:700;color:var(--mute);font-size:14px}
td.n{white-space:nowrap}
@media(max-width:600px){.slot{grid-template-columns:86px minmax(0,1fr) auto}.chip{font-size:14px}table{font-size:14px}.stack thead{display:none}.stack tr{display:grid;padding-block:8px;border-bottom:1px solid var(--line)}.stack td{display:flex;justify-content:space-between;gap:12px;border:0;padding:3px 0}.stack td::before{content:attr(data-l);color:var(--mute);font-weight:600}}
@media(prefers-reduced-motion:no-preference){.day,.card{animation:up .25s ease-out both}@keyframes up{from{opacity:0;transform:translateY(6px)}}}
</style>
</head>

function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parse(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)}
function addDays(k,n){const d=parse(k);d.setDate(d.getDate()+n);return ymd(d)}

/* Israel wall-clock time, DST-aware via the IANA zone */
function ilParts(t){const p={};new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jerusalem',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(t==null?new Date():new Date(t)).forEach(x=>p[x.type]=x.value);return {date:`${p.year}-${p.month}-${p.day}`,time:`${p.hour}:${p.minute}`}}

const deadline=wk=>addDays(wk,-4);
function isLockedWk(wk,now){const n=now||ilParts();return (n.date+' '+n.time)>=(deadline(wk)+' 13:00')}

function errMsg(e){const m=String((e&&(e.message||e.error_description))||e||'');
  if(/row-level security|not allowed|permission denied|violates/i.test(m))return 'אין הרשאה לפעולה הזאת. ייתכן שההגשה כבר נסגרה או שהחשבון הושבת.';
  if(/Invalid login credentials/i.test(m))return 'המייל או הסיסמה לא נכונים.';
  if(/already registered|already been registered/i.test(m))return 'המייל הזה כבר רשום. אפשר להיכנס או לאפס סיסמה.';
  if(/Password should be at least/i.test(m))return 'הסיסמה צריכה להיות לפחות 6 תווים.';
  if(/Email not confirmed/i.test(m))return 'צריך לאשר את המייל לפני הכניסה. בדוק את תיבת הדואר.';
  if(/missing day choice/i.test(m))return 'צריך לבחור לכל יום משמרת או "לא זמין" לפני השליחה.';
  if(/unavailable days/i.test(m))return 'סימנת יותר מדי ימים כלא זמין. לימים נוספים צריך להגיש בקשת חופש.';
  if(/rate limit|too many/i.test(m))return 'יותר מדי ניסיונות. נסה שוב בעוד כמה דקות.';
  if(/fetch|network|Failed to/i.test(m))return 'אין חיבור לשרת. בדוק את האינטרנט ונסה שוב.';
  return 'הפעולה נכשלה: '+m}

function allReqs(){const out=[];Object.entries(S.leaveAll).forEach(([uid,l])=>Object.entries(l.reqs||{}).forEach(([id,r])=>{const d=((S.accts[uid]||{}).leave||{})[id];out.push({uid,id,...r,st:d?d.st:(r.cancelled?'cancelled':'pending'),mnote:d&&d.note,dt:d&&d.t})}));return out.sort((a,b)=>b.t-a.t)}

const ms=t=>t?Date.parse(t):0;
async function fetchAll(table,order){const out=[];for(let i=0;;i+=1000){let q=sb.from(table).select('*').range(i,i+999);if(order)q=q.order(order);const {data,error}=await q;if(error)throw error;out.push(...data);if(data.length<1000)break}return out}
async function loadAll(){
  if(!S.session){render();return}
  const seq=++loadSeq;
  try{
    const [pr,st,av,hi,ul,lv,ps,ox]=await Promise.all([fetchAll('profiles'),sb.from('settings').select('data').eq('id',1).maybeSingle(),fetchAll('availability'),fetchAll('availability_history','id'),fetchAll('unlocks'),fetchAll('leave_requests'),fetchAll('published_schedules'),fetchAll('off_exempt').catch(()=>[])]);
    if(st.error)throw st.error;
    const me=pr.find(p=>p.id===S.uid);
    let sc=[],mst=null;
    if(me&&me.role==='manager'&&me.active&&me.approved!==false){sc=await fetchAll('schedules');const r=await sb.from('manager_state').select('seen').eq('user_id',S.uid).maybeSingle();mst=r.data}
    if(seq!==loadSeq)return;
    S.cfg={...DEF,...((st.data&&st.data.data)||{})};
    S.me=me||null;
    const wasOwner=S.owner;S.owner=!!(me&&me.role==='manager'&&me.active&&me.approved!==false);
    if(S.owner&&!wasOwner&&S.mode==='emp'&&!S.modeSet){S.mode='mgr';S.wk=openWeek()}
    if(!S.owner)S.mode='emp';
    S.staff=pr.map(p=>({id:p.id,name:p.name,phone:p.phone,role:p.role,approved:p.approved!==false,t:ms(p.created_at)})).sort((a,b)=>String(a.name).localeCompare(String(b.name),'he'));
    const A={};pr.forEach(p=>A[p.id]={active:p.active,approved:p.approved!==false,role:p.role,unlock:{},leave:{}});
    ul.forEach(u=>{(A[u.user_id]=A[u.user_id]||{unlock:{},leave:{}}).unlock[u.week]=true});
    ox.forEach(u=>{const a=(A[u.user_id]=A[u.user_id]||{unlock:{},leave:{}});(a.offEx=a.offEx||{})[u.week]=true});
    lv.forEach(r=>{if(r.status==='approved'||r.status==='rejected')(A[r.user_id]=A[r.user_id]||{unlock:{},leave:{}}).leave[r.id]={st:r.status,note:r.manager_note,t:ms(r.decided_at)}});
    S.accts=A;
    const H={};hi.forEach(h=>{const k=h.user_id+'|'+h.week;(H[k]=H[k]||[]).push({t:ms(h.created_at),picks:h.picks,note:h.note})});
    const V={};av.forEach(a=>{const hs=H[a.user_id+'|'+a.week]||[];((V[a.user_id]=V[a.user_id]||{weeks:{}}).weeks)[a.week]={picks:a.picks,note:a.note,t:ms(a.updated_at),first:hs[0]||{picks:a.picks,note:a.note,t:ms(a.created_at)},hist:hs.length?hs:[{t:ms(a.created_at),picks:a.picks,note:a.note}]}});
    S.availAll=V;
    const L={};lv.forEach(r=>{((L[r.user_id]=L[r.user_id]||{reqs:{}}).reqs)[r.id]={dates:r.dates,reason:r.reason,detail:r.detail,t:ms(r.created_at),cancelled:r.status==='cancelled',by:r.by_manager?'mgr':''}});
    S.leaveAll=L;
    S.avail=V[S.uid]||{};S.leave=L[S.uid]||{};S.acct=A[S.uid]||{};
    S.pubAll={};ps.forEach(p=>S.pubAll[p.week]={cells:p.cells,notes:p.notes||{},t:ms(p.published_at)});
    S.schedAll={};sc.forEach(x=>S.schedAll[x.week]={cells:x.cells,targets:x.targets,notes:x.notes||{},published:x.published,t:ms(x.updated_at)});
    S.seen=mst?ms(mst.seen):0;
    syncWeek();S.loading=false;
  }catch(e){if(seq!==loadSeq)return;S.loading=false;S.msg=errMsg(e)}
  render()}
function syncWeek(){S.pub=S.pubAll[S.wk]||null;S.sched=S.schedAll[S.wk]||null;if(S.tgWk!==S.wk){S.tg=JSON.parse(JSON.stringify((S.sched&&S.sched.targets)||{}));S.tgWk=S.wk}}
function reloadSoon(){clearTimeout(reloadT);reloadT=setTimeout(loadAll,400)}
let chan=null;

(async()=>{
  S.wk=openWeek();
  if(!window.supabase||!CFG.url||!CFG.key){S.loading=false;S.msg='noconfig';render();return}
  sb=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});

  return {cells,warn};
}

  case 'editMe':S.edit=S.edit==='me'?null:'me';S.form.meName=undefined;S.form.mePhone=undefined;break;
  case 'saveMe':{const n=(S.form.meName??S.me.name).trim();if(n.length<2){S.msg='כתוב שם מלא';break}
    if(await run(()=>sb.from('profiles').update({name:n,phone:(S.form.mePhone??S.me.phone??'').trim()}).eq('id',S.uid),'הפרטים נשמרו'))S.edit=null;break}
  case 'copyPrev':{const p=(S.avail.weeks||{})[addDays(S.wk,-7)];if(!p||!canEditWk(S.wk))break;S.pick=JSON.parse(JSON.stringify(p.picks||{}));S.dirty=true;S.ok='הועתק. בדוק ושלח.';break}
  case 'pick':{if(!canEditWk(S.wk))break;const p={...getPicks()};if(ds.o==='off'){if(raw(p,ds.d).includes('off'))delete p[ds.d];else p[ds.d]=['off']}else{const c=pk(p,ds.d);p[ds.d]=c.includes(ds.o)?c.filter(x=>x!==ds.o):[...c,ds.o];if(!p[ds.d].length)delete p[ds.d]}S.pick=p;S.dirty=true;break}
  case 'submit':{if(!canEditWk(S.wk)){S.msg='ההגשה לשבוע הזה כבר נסגרה.';break}
    {const lv=new Set(myReqs().filter(r=>r.st==='pending'||r.st==='approved').flatMap(r=>r.dates)),off=offDays(getPicks(),lv),miss=missingDays(getPicks(),lv);if(miss.length){S.showMissing=true;S.msg=`אי אפשר לשלוח עדיין: צריך לבחור לכל יום משמרת או "לא זמין". חסר: ${miss.map(d=>DAYS[d]).join(', ')}.`;break}if(off.length>maxOff()&&!offEx(S.wk)){S.msg=`אפשר לסמן עד ${maxOff()} ימים כלא זמין (סימנת ${off.length}). לימים נוספים צריך להגיש בקשת חופש, או לבקש מהמנהל אישור מיוחד.`;break}}
    const picks={...getPicks()},prev=(S.avail.weeks||{})[S.wk],note=S.form.note!==undefined?S.form.note:(prev&&prev.note)||'';
    if(prev&&JSON.stringify(prev.picks||{})===JSON.stringify(picks)&&(prev.note||'')===note){S.dirty=false;S.pick=null;S.ok='אין שינויים לשמור';break}
    const wk=S.wk,now=Date.now();
    if(await run(()=>sb.from('availability').upsert({user_id:S.uid,week:wk,picks,note},{onConflict:'user_id,week'}))){S.showMissing=false;S.pick=null;S.dirty=false;S.form.note=undefined;S.sent={kind:prev?'upd':'sub',wk,t:now,prev:prev&&prev.picks,now:picks};window.scrollTo(0,0)}
    break}
  case 'calm':{const f=parse(S.cal);S.cal=ymd(new Date(f.getFullYear(),f.getMonth()+ +ds.n,1));break}
  case 'cald':{const k=ds.k;S.calSel=S.calSel.includes(k)?S.calSel.filter(x=>x!==k):[...S.calSel,k].sort();break}
  case 'calclr':S.calSel=[];break;
  case 'sendLeave':{const f=S.form,min=addDays(ilToday(),LEAD);
    if(!S.calSel.length){S.msg='בחר לפחות תאריך אחד';break}
    if(S.calSel.some(k=>k<min)){S.msg=`אפשר לבקש רק מ-${fmtD(min)} והלאה. למקרה חריג פנה למנהל.`;break}
    if(!f.lvReason){S.msg='בחר סיבה לבקשה';break}
    if(f.lvReason==='other'&&!(f.lvDetail||'').trim()){S.msg='כתוב פירוט לסיבה';break}
    const r={dates:[...S.calSel],reason:f.lvReason,detail:(f.lvDetail||'').trim()};
    if(await run(()=>sb.from('leave_requests').insert({user_id:S.uid,...r}))){S.sentLeave=r;S.ok='LEAVE_SENT';S.calSel=[];S.form.lvReason='';S.form.lvDetail='';window.scrollTo(0,0)}break}
  case 'noConfirm':S.confirm=null;break;
  case 'delLeave':{if(S.confirm!=='dl_'+ds.id){S.confirm='dl_'+ds.id;break}S.confirm=null;await run(()=>sb.rpc('mgr_delete_leave',{rid:ds.id}),'הבקשה נמחקה');break}
  case 'delAvail':{if(S.confirm!=='da_'+ds.e){S.confirm='da_'+ds.e;break}S.confirm=null;delete S.tg[ds.e];await run(()=>sb.rpc('mgr_delete_avail',{uid:ds.e,w:S.wk}),'ההגשה נמחקה. העובד יכול להגיש מחדש.');break}
  case 'cancelLeave':await run(()=>sb.rpc('cancel_leave',{rid:ds.id}),'הבקשה בוטלה');break;
  case 'lf':S.lf=ds.v;S.tab='leave';break;
  case 'exc':S.exc=!S.exc;S.cal=null;S.calSel=[];break;
  case 'sendExc':{const f=S.form,u=f.excWho;if(!u){S.msg='בחר עובד';break}if(!S.calSel.length){S.msg='בחר תאריכים';break}if(!f.lvReason){S.msg='בחר סיבה';break}
    if(await run(()=>sb.from('leave_requests').insert({user_id:u,dates:[...S.calSel],reason:f.lvReason,detail:(f.lvDetail||'').trim(),by_manager:true}),'הבקשה נוספה')){S.exc=false;S.calSel=[];S.form.lvReason='';S.form.lvDetail='';S.lf='pending'}break}
  case 'decide':{const note=ds.v==='pending'?'':(S.form['ln_'+ds.u+'_'+ds.id]||'').trim();
    if(await run(()=>sb.from('leave_requests').update({status:ds.v,manager_note:note}).eq('id',ds.id),ds.v==='approved'?'הבקשה אושרה. העובד רואה את העדכון באזור האישי שלו.':ds.v==='rejected'?'הבקשה נדחתה. העובד רואה את העדכון באזור האישי שלו.':'הבקשה הוחזרה להמתנה'))S.lf=ds.v;break}
  case 'seen':await run(()=>sb.from('manager_state').upsert({user_id:S.uid,seen:new Date().toISOString()}));break;
  case 'editStaff':S.edit=ds.e||null;S.form.ed_name=undefined;S.form.ed_phone=undefined;break;
  case 'saveStaff':{const s=S.staff.find(x=>x.id===ds.e);if(!s)break;const n=(S.form.ed_name??s.name).trim();if(n.length<2){S.msg='שם קצר מדי';break}
    if(await run(()=>sb.from('profiles').update({name:n,phone:(S.form.ed_phone??s.phone??'').trim()}).eq('id',ds.e),'הפרטים עודכנו'))S.edit=null;break}
  case 'toggleActive':{if(S.confirm!=='act_'+ds.e){S.confirm='act_'+ds.e;break}S.confirm=null;const on=(S.accts[ds.e]||{}).active!==false;
    await run(()=>sb.from('profiles').update(on?{active:false}:{active:true,approved:true}).eq('id',ds.e),on?'החשבון הושבת. הנתונים שלו נשמרים.':'החשבון הופעל מחדש');break}
  case 'approve':await run(()=>sb.from('profiles').update({approved:true,active:true}).eq('id',ds.e),'העובד אושר ויכול להיכנס');break;
  case 'reject':{if(S.confirm!=='rej_'+ds.e){S.confirm='rej_'+ds.e;break}S.confirm=null;await run(()=>sb.from('profiles').update({active:false}).eq('id',ds.e),'ההרשמה נדחתה. אפשר לאשר אותו בהמשך מרשימת המושבתים.');break}
  case 'role':{if(S.confirm!=='role_'+ds.e){S.confirm='role_'+ds.e;break}S.confirm=null;const s=S.staff.find(x=>x.id===ds.e);if(!s)break;const to=s.role==='manager'?'employee':'manager';
    await run(()=>sb.from('profiles').update({role:to}).eq('id',ds.e),to==='manager'?'ניתנה הרשאת מנהל':'הרשאת המנהל הוסרה');break}
  case 'offEx':{const has=((S.accts[ds.e]||{}).offEx||{})[S.wk];
    await run(()=>has?sb.from('off_exempt').delete().eq('user_id',ds.e).eq('week',S.wk):sb.from('off_exempt').insert({user_id:ds.e,week:S.wk}),has?'האישור המיוחד בוטל':'העובד יכול לסמן לשבוע הזה יותר ימים כלא זמין');break}
  case 'unlock':{const has=((S.accts[ds.e]||{}).unlock||{})[S.wk];
    await run(()=>has?sb.from('unlocks').delete().eq('user_id',ds.e).eq('week',S.wk):sb.from('unlocks').insert({user_id:ds.e,week:S.wk}),has?'העריכה ננעלה שוב':'העובד יכול לערוך שוב את הזמינות לשבוע הזה');break}
  case 'hist':S.tab='hist';S.open={[ds.e]:true};break;
  case 'open':S.open[ds.e]=!S.open[ds.e];break;
  case 'img':S.imgWk=S.wk;shareImage();return;
  case 'imgDl':fetch(S.imgUrl).then(r=>r.blob()).then(b=>saveFile(`סידור-עבודה-${short(S.wk).replace('.','-')}.png`,b,'image/png'));return;
  case 'imgClose':if(S.imgUrl)URL.revokeObjectURL(S.imgUrl);S.imgUrl=null;break;
  case 'xlsx':exportX();return;
  case 'backup':backup();return;
  case 'savePhone':await saveCfg({mgrPhone:(S.form.mgrPhone??'').trim()});S.ok='נשמר';break;
  case 'tg':{const t=S.tg[ds.e]=S.tg[ds.e]||{};t[ds.s]=Math.max(0,(t[ds.s]||0)+ +ds.n);break}
  case 'tgAll':{let k=0;people().forEach(e=>{const p=(S.subs[e.id]&&S.subs[e.id].picks)||{};const c=s=>days().filter(d=>hasS(p,d,s)).length;S.tg[e.id]={a:c('a'),m:c('m'),e:c('e'),x:c('x')};k+=c('a')+c('m')+c('e')+c('x')});if(!k)S.msg='אין עדיין הגשות לשבוע הזה, אז אין מה למלא.';else S.ok='מולא לפי כל מה שהעובדים הגישו';break}
  case 'tgZero':S.tg={};S.ok='הכמויות אופסו';break;
  case 'auto':{if(!Object.values(S.tg).some(t=>(+t.a||0)+(+t.m||0)+(+t.e||0)+(+t.x||0)>0)){S.msg='קבע קודם לכל עובד כמה משמרות לתת לו (או לחץ "כל מה שהגישו").';break}const r=auto();S.warn=r.warn;S.tab='sched';saveSched({cells:r.cells,targets:JSON.parse(JSON.stringify(S.tg))});window.scrollTo(0,0);return}
  case 'rm':{const cells=cloneCells();cells[ds.d]=(cells[ds.d]||[]).filter(x=>x.e!==ds.e);saveSched({cells});return}
  case 'pub':if(ds.v==='1'){const c=pubCells(),wk=S.wk;
      if(await run(()=>sb.from('published_schedules').upsert({week:wk,cells:c,notes:(S.sched&&S.sched.notes)||{},published_at:new Date().toISOString()})))await saveSched({published:true},'פורסם. העובדים רואים את הסידור.')}
    else{const wk=S.wk;if(await run(()=>sb.from('published_schedules').delete().eq('week',wk)))await saveSched({published:false},'הפרסום בוטל')}break;
  case 'clear':if(!ds.v){S.confirm='clear';break}S.confirm=null;if(ds.v==='no')break;S.warn=[];saveSched({cells:{}},'הסידור נוקה');return;
  case 'copy':try{await navigator.clipboard.writeText(waText());S.ok='הועתק. הדבק בקבוצת העובדים.'}catch(e){S.msg='ההעתקה נחסמה בדפדפן הזה'}break;
  case 'day':{const i=+ds.d,cur=S.cfg.days.map(Number);saveCfg({days:cur.includes(i)?cur.filter(x=>x!==i):[...cur,i].sort()});return}
  case 'ev':saveCfg({ev:Math.min(6,Math.max(1,(+S.cfg.ev||1)+ +ds.n))});return;
  case 'm10':saveCfg({m10:!S.cfg.m10});return;
  case 'msT':saveCfg({ms:!msOn()});return;
  case 'maxOff':saveCfg({maxOff:Math.min(7,Math.max(0,maxOff()+ +ds.n))});return;
  case 'friT':saveCfg({friShort:S.cfg.friShort===false});return;
  case 'bakeT':saveCfg({bake:!bakeOn()});return;
  case 'msN':saveCfg({msNeed:Math.min(6,Math.max(1,(+S.cfg.msNeed||1)+ +ds.n))});return;
  }}finally{busy.delete(a)}
  render();
});
}
</script>
