name: keep-alive
# Pings the Supabase database twice a week so the free project never pauses for inactivity.
on:
  schedule:
    - cron: '17 7 * * 1,4'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          KEY=$(curl -fsS https://ronch-kiryon.github.io/config.js | grep -o "sb_publishable_[A-Za-z0-9_-]*" | head -1)
          test -n "$KEY"
          curl -fsS -X POST "https://ittyiiilvcdlzjpxenuw.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
